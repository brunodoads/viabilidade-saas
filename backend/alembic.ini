# Alembic Configuration File
# Documentação: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Caminho para o diretório de migrations
script_location = alembic

# Template para nome dos arquivos de migration gerados
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Fuso horário para timestamps nas migrations (UTC sempre)
timezone = UTC

# Truncar mensagem do slug em N chars (padrão 40)
truncate_slug_length = 40

# DATABASE_URL é injetada pelo env.py via variável de ambiente
# Não colocar URL aqui — fica no .env
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Formatar migrations automaticamente com black após gerar
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
